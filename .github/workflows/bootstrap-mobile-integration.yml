name: Bootstrap mobile integration

on:
  push:
    branches:
      - feat/expo-mobile-foundation-20260802
  pull_request:
    branches:
      - main
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-mobile-integration.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Verificar se a integração já foi aplicada
        id: gate
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq "[mobile-overlay-applied]"; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruir e validar pacote
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          cat bootstrap/part-*.b64 | base64 --decode > /tmp/mobile-integration-overlay.tar.gz
          echo "26dbadf6eba922b6ca1e14db25f611be691a10dc8919211ec4b93f937e9989fb  /tmp/mobile-integration-overlay.tar.gz" | sha256sum --check --strict

      - name: Extrair integração validada
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: tar -xzf /tmp/mobile-integration-overlay.tar.gz -C .

      - name: Separar workflow móvel para commit do conector
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: rm -f .github/workflows/mobile-foundation.yml

      - name: Remover transporte temporário
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          rm -f bootstrap/part-*.b64
          rmdir bootstrap || true

      - name: Commitar integração
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(mobile): integrar Expo, API móvel e Supabase [mobile-overlay-applied]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
