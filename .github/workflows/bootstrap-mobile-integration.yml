name: Bootstrap mobile integration

on:
  push:
    branches:
      - feat/expo-mobile-foundation-20260802

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-overlay-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir e validar pacote
        shell: bash
        run: |
          cat bootstrap/part-*.b64 | base64 --decode > /tmp/mobile-integration-overlay.tar.gz
          echo "26dbadf6eba922b6ca1e14db25f611be691a10dc8919211ec4b93f937e9989fb  /tmp/mobile-integration-overlay.tar.gz" | sha256sum --check --strict

      - name: Extrair integração validada
        shell: bash
        run: tar -xzf /tmp/mobile-integration-overlay.tar.gz -C .

      - name: Remover transporte temporário
        shell: bash
        run: |
          rm -f bootstrap/part-*.b64
          rmdir bootstrap || true

      - name: Commitar integração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(mobile): integrar Expo, API móvel e Supabase [mobile-overlay-applied]"
          git push origin HEAD:${GITHUB_REF_NAME}
